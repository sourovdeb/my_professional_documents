model:
  default: agnes-2.5-flash
  provider: agnes-ai
  base_url: https://apihub.agnes-ai.com/v1
  key_env: HERMES_CUSTOM_AGNES_AI_API_KEY
providers:
  custom:mistral-small:
    name: Mistral Small (Custom)
    base_url: https://api.mistral.ai/v1/
    model: mistral-small-latest
    discover_models: true
    models:
      mistral-small-latest: {}
      ministral-14b-latest: {}
    key_env: MISTRAL_API_KEY
    default_model: ministral-14b-latest
  agnes-ai:
    name: Agnes Ai
    base_url: https://apihub.agnes-ai.com/v1
    model: agnes-2.0-flash
    discover_models: true
    models:
      agnes-2.0-flash: {}
    key_env: HERMES_CUSTOM_AGNES_AI_API_KEY
fallback_providers:
  - provider: agnes-ai
    model: agnes-2.5-flash
  - provider: xai-oauth
    model: grok-4.6
  - provider: zai
    model: glm-5.3-flash
agent:
  reasoning_effort: high
browser:
  backend: browser-use
  cloud_provider: camofox
  inactivity_timeout: 12000
  headed: true
  camofox:
    managed_persistence: true
auxiliary:
  web_extract:
    provider: auto
    model: ''
  approval:
    provider: custom:mistral-small
    model: mistral-small-latest
    base_url: ''
display:
  personality: concise
delegation:
  model: agnes-2.0-flash
  provider: agnes-ai
moa:
  presets:
    default:
      reference_models: []
      aggregator:
        provider: zai
        model: glm-4.5-flash
      degraded_reference_policy: loud
      fanout: user_turn
  enabled: false
  reference_models: []
  aggregator:
    provider: zai
    model: glm-4.5-flash
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
command_allowlist:
  - execute_code
  - script execution via -e/-c flag
  - access to Hermes secrets (Windows path)
security:
  redact_secrets: true
kanban:
  orchestrator_profile: 4_job_search
  default_assignee: 1_system_manager
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 34
mcp_servers:
  browseros-neo:
    url: http://127.0.0.1:9010/mcp
    enabled: true
    timeout: 120
    connect_timeout: 60
  indeed:
    url: https://mcp.indeed.com/claude/mcp
    auth: oauth
    enabled: true
    timeout: 120
    connect_timeout: 60
    tools:
      include:
        - search_jobs
        - get_job_details
      prompts: false
      resources: false
  skyvern:
    url: https://api.skyvern.com/mcp/
    env_key: SKYVERN_API_KEY
    enabled: true
    timeout: 120
custom_providers:
  - name: mistral-small
    base_url: https://api.mistral.ai/v1
    key_env: HERMES_CUSTOM_API_MISTRAL_AI_API_KEY
