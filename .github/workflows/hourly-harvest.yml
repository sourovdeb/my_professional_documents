name: Hourly FT offer harvest

on:
  schedule:
    - cron: "7 * * * *" # hourly at :07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harvester
        run: python scripts/hourly_harvest.py

      - name: Commit refreshed queue
        run: |
          git config user.name "harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "harvest: refresh fresh_offers queue $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
